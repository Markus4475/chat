<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чат</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f0f0f; color: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; padding: 12px; }
    .chat-box { width: 100%; max-width: 440px; height: 85vh; background: #1a1a1a; border: 1px solid #2d2d2d; border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .header { padding: 14px 16px; background: #222; border-bottom: 1px solid #2d2d2d; display: flex; justify-content: space-between; align-items: center; }
    .header input { background: #141414; border: 1px solid #3a3a3a; color: #fff; padding: 6px 10px; border-radius: 8px; font-size: 13px; width: 130px; outline: none; }
    .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 8px 12px; border-radius: 10px; font-size: 14px; background: #262626; align-self: flex-start; word-break: break-word; line-height: 1.4; }
    .msg.mine { background: #2563eb; align-self: flex-end; }
    .sender { font-size: 11px; opacity: 0.6; margin-bottom: 2px; font-weight: 600; }
    .form { display: flex; padding: 12px; background: #222; border-top: 1px solid #2d2d2d; gap: 8px; }
    .form input { flex: 1; padding: 10px 14px; background: #141414; border: 1px solid #3a3a3a; border-radius: 8px; color: #fff; outline: none; font-size: 14px; }
    .form button { background: #2563eb; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
    .form button:hover { background: #1d4ed8; }
  </style>
</head>
<body>

<div class="chat-box">
  <div class="header">
    <span style="font-weight: 600; font-size: 15px;">Онлайн Чат</span>
    <input type="text" id="username" value="Участник">
  </div>
  <div class="messages" id="messages"></div>
  <form class="form" id="form">
    <input type="text" id="input" placeholder="Сообщение..." autocomplete="off" required>
    <button type="submit">Отправить</button>
  </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const username = document.getElementById('username');
  const messages = document.getElementById('messages');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (input.value.trim()) {
      socket.emit('chat message', {
        user: username.value.trim() || 'Аноним',
        text: input.value.trim()
      });
      input.value = '';
    }
  });

  socket.on('chat message', (data) => {
    const isMine = data.user === username.value.trim();
    const item = document.createElement('div');
    item.className = 'msg' + (isMine ? ' mine' : '');
    item.innerHTML = `<div class="sender">${escapeHtml(data.user)}</div><div>${escapeHtml(data.text)}</div>`;
    messages.appendChild(item);
    messages.scrollTop = messages.scrollHeight;
  });

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.innerText = str;
    return d.innerHTML;
  }
</script>
</body>
</html>
