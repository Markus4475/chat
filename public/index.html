<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ChatterBox</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
    --bg: #b8d9e8;
    --bg-dark: #1a2a3a;
    --text: #111;
    --text-dark: #eee;
    --card-bg: rgba(255,255,255,0.15);
    --card-bg-dark: rgba(0,0,0,0.25);
    --border: rgba(0,0,0,0.06);
    --border-dark: rgba(255,255,255,0.04);
    --msg-bg: rgba(255,255,255,0.75);
    --msg-own: rgba(0,132,255,0.75);
    --shadow: 0 1px 4px rgba(0,0,0,0.04);
    --radius: 14px;
    --font-size: 15px;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    transition: background 0.3s, color 0.3s;
    position: relative;
    overflow: hidden;
    color: var(--text);
    font-size: var(--font-size);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}

body.dark {
    --bg: var(--bg-dark);
    --text: var(--text-dark);
    --card-bg: rgba(255,255,255,0.05);
    --border: rgba(255,255,255,0.04);
    --msg-bg: rgba(255,255,255,0.1);
    --msg-own: rgba(0,132,255,0.6);
}

body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 0;
    background: 
        radial-gradient(ellipse at 10% 20%, rgba(180, 220, 240, 0.5) 0%, transparent 60%),
        radial-gradient(ellipse at 90% 80%, rgba(200, 240, 200, 0.4) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 50%, rgba(240, 220, 180, 0.3) 0%, transparent 70%),
        linear-gradient(135deg, #b8d9e8 0%, #d4e8d4 50%, #f0e6c8 100%);
    pointer-events: none;
}

body.dark::before {
    background: 
        radial-gradient(ellipse at 10% 20%, rgba(60, 100, 140, 0.3) 0%, transparent 60%),
        radial-gradient(ellipse at 90% 80%, rgba(60, 120, 80, 0.25) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 50%, rgba(120, 80, 60, 0.2) 0%, transparent 70%),
        linear-gradient(135deg, #1a2a3a 0%, #1a2a2a 50%, #2a1a1a 100%);
}

.chat {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}
body.dark .chat { background-image: none; }

.chat::-webkit-scrollbar { width: 4px; }
.chat::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
body.dark .chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); }

.auth-screen, .main-app, .attach-panel, .message-menu, .menu-panel, 
.incoming-call, .call-status, .group-members-panel, .modal, .profile-screen,
.settings-screen, .channels-screen, .contacts-screen, .groups-screen,
.privacy-screen, .permissions-screen, .translator-panel, .scheduler-panel,
.pinned-messages-panel, .group-screen, .directory-overlay {
    position: relative;
    z-index: 1;
}

.hidden { display: none !important; }

/* Экран авторизации */
.auth-screen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 1000;
}
.auth-card {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 32px;
    padding: 40px 28px;
    width: 100%;
    max-width: 340px;
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    text-align: center;
}
body.dark .auth-card { border-color: rgba(255,255,255,0.08); }
.auth-card h2 { margin-bottom: 24px; font-size: 26px; font-weight: 700; color: var(--text); }
.auth-card input {
    width: 100%;
    padding: 14px 18px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    border-radius: 28px;
    font-size: 15px;
    outline: none;
    background: rgba(255,255,255,0.4);
    color: var(--text);
}
body.dark .auth-card input { background: rgba(255,255,255,0.06); color: var(--text); border-color: var(--border-dark); }
.auth-card button {
    width: 100%;
    padding: 14px;
    background: rgba(0,132,255,0.85);
    border: none;
    border-radius: 28px;
    font-size: 16px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    margin-top: 8px;
    transition: 0.2s;
}
.auth-card button:active { transform: scale(0.98); }

/* Главный макет */
.main-app { 
    display: flex; 
    flex-direction: column; 
    height: 100%; 
    position: relative;
    z-index: 1;
}

.header {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
}
body.dark .header { background: var(--card-bg-dark); border-bottom-color: var(--border-dark); }

.menu-btn, .dots-btn, .icon-btn {
    background: transparent;
    border: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    flex-shrink: 0;
    transition: 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}
.menu-btn:active, .dots-btn:active, .icon-btn:active { transform: scale(0.9); background: var(--border); }

.header .nav-center { 
    flex: 1; 
    text-align: center; 
    font-size: 17px; 
    font-weight: 700; 
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.header .nav-right { display: flex; align-items: center; gap: 6px; }

/* Полоса режима чата (Канал / Личка / Группа) */
.mode-bar {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    padding: 6px 12px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
}
.mode-bar span { font-weight: 600; flex: 1; color: var(--text); }
.mode-bar button {
    background: var(--border);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 4px 12px;
    border-radius: 14px;
    cursor: pointer;
    font-size: 12px;
}

/* Сообщения */
.message {
    max-width: 80%;
    padding: 8px 12px;
    border-radius: 18px;
    font-size: var(--font-size);
    background: var(--msg-bg);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.15);
    align-self: flex-start;
    word-break: break-word;
    position: relative;
    color: var(--text);
    box-shadow: var(--shadow);
}
body.dark .message { border-color: rgba(255,255,255,0.05); }
.message.own { background: var(--msg-own); color: white; align-self: flex-end; }
.message .author {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 3px;
    color: #0084ff;
    cursor: pointer;
}
.message.own .author { color: rgba(255,255,255,0.85); }
.message .msg-text { display: block; line-height: 1.4; }
.message .time { 
    font-size: 10px; 
    opacity: 0.6; 
    margin-top: 4px; 
    display: flex; 
    align-items: center; 
    justify-content: flex-end; 
    gap: 4px; 
}

/* Поле ввода сообщения */
.input-bar {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    border-top: 1px solid var(--border);
}
body.dark .input-bar { background: var(--card-bg-dark); border-top-color: var(--border-dark); }
.input-bar input {
    flex: 1;
    padding: 10px 16px;
    border: 1px solid var(--border);
    border-radius: 24px;
    font-size: 15px;
    outline: none;
    background: rgba(255,255,255,0.4);
    color: var(--text);
}
body.dark .input-bar input { background: rgba(255,255,255,0.06); border-color: var(--border-dark); }

/* КАТАЛОГ / СПИСОК ЧАТОВ (Directory Sheet) */
.directory-overlay {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 320px;
    max-width: 85%;
    background: var(--card-bg);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border-right: 1px solid var(--border);
    box-shadow: 4px 0 24px rgba(0,0,0,0.15);
    z-index: 500;
    display: flex;
    flex-direction: column;
    transform: translateX(-100%);
    transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
}
.directory-overlay.open { transform: translateX(0); }
body.dark .directory-overlay { background: var(--card-bg-dark); border-color: var(--border-dark); }

.dir-header {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
}
.dir-header h3 { font-size: 18px; font-weight: 700; }

.dir-search {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
}
.dir-search input {
    width: 100%;
    padding: 8px 14px;
    border-radius: 16px;
    border: 1px solid var(--border);
    outline: none;
    font-size: 14px;
    background: rgba(255,255,255,0.3);
    color: var(--text);
}
body.dark .dir-search input { background: rgba(255,255,255,0.06); border-color: var(--border-dark); }

.directory-body {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
}

.dir-section {
    padding: 8px 16px 4px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.5;
}

.dir-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    cursor: pointer;
    transition: background 0.15s ease;
}
.dir-item:hover, .dir-item:active { background: rgba(0,132,255,0.12); }
.dir-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(0,132,255,0.85);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 16px;
    flex-shrink: 0;
}
.dir-info { flex: 1; min-width: 0; }
.dir-title-row { display: flex; justify-content: space-between; align-items: center; }
.dir-title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.dir-time { font-size: 11px; opacity: 0.5; }
.dir-sub { font-size: 12px; opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.dir-badge {
    background: #0084ff;
    color: #fff;
    font-size: 10px;
    font-weight: bold;
    border-radius: 10px;
    padding: 2px 6px;
    margin-left: 6px;
}
.dir-backdrop {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(2px);
    z-index: 490;
    display: none;
}
.dir-backdrop.open { display: block; }

/* Выпадающее меню настроек/действий */
.menu-panel {
    position: fixed;
    top: 56px;
    left: 12px;
    background: var(--card-bg);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    display: none;
    flex-direction: column;
    z-index: 1100;
    min-width: 210px;
    overflow: hidden;
}
.menu-panel.open { display: flex; }
body.dark .menu-panel { background: var(--card-bg-dark); border-color: var(--border-dark); }
.menu-item {
    padding: 12px 18px;
    cursor: pointer;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text);
}
.menu-item:last-child { border-bottom: none; }
.menu-item:hover { background: rgba(0,132,255,0.1); }
</style>
</head>
<body>

<!-- Экран авторизации -->
<div class="auth-screen" id="authScreen">
    <div class="auth-card">
        <h2>ChatterBox</h2>
        <input type="text" id="authNick" placeholder="Ваш никнейм" autocomplete="off">
        <input type="tel" id="authPhone" placeholder="Номер телефона (опционально)" autocomplete="off">
        <button id="authBtn">Войти</button>
    </div>
</div>

<!-- Выпадающее меню -->
<div class="menu-panel" id="menuPanel">
    <div class="menu-item" id="menuOpenChats">💬 Список чатов</div>
    <div class="menu-item" id="menuCreateChannel">📣 Создать канал</div>
    <div class="menu-item" id="menuCreateGroup">👥 Создать группу</div>
    <div class="menu-item" id="menuToggleTheme">🌓 Сменить тему</div>
    <div class="menu-item" id="menuLogout">🚪 Выйти</div>
</div>

<!-- Затемнение для бокового каталога -->
<div class="dir-backdrop" id="dirBackdrop"></div>

<!-- Каталог / Вкладка Чаты (Выезжает сбоку) -->
<div class="directory-overlay" id="directoryOverlay">
    <div class="dir-header">
        <h3>Чаты</h3>
        <button class="icon-btn" id="closeDirBtn">✕</button>
    </div>
    <div class="dir-search">
        <input type="text" id="directorySearchInput" placeholder="Поиск (имя, 15 цифр кода, тел.)...">
    </div>
    <div class="directory-body" id="directoryBody"></div>
</div>

<!-- Основной экран ChatterBox -->
<div class="main-app hidden" id="mainApp">
    <!-- Шапка -->
    <div class="header">
        <button class="menu-btn" id="menuBtn">☰</button>
        <button class="icon-btn" id="openChatsBtn" title="Чаты">💬</button>
        <div class="nav-center" id="headerTitle">Общий чат</div>
        <div class="nav-right">
            <span id="headerSub" style="font-size:12px;opacity:0.65;">онлайн</span>
            <button class="dots-btn" id="dotsBtn">⋮</button>
        </div>
    </div>

    <!-- Режим/инфо чата -->
    <div class="mode-bar" id="modeBar">
        <span id="modeBarText">🌐 Общий чат ChatterBox</span>
    </div>

    <!-- Список сообщений -->
    <div class="chat" id="chat"></div>

    <!-- Поле ввода -->
    <div class="input-bar">
        <input type="text" id="msgInput" placeholder="Напишите сообщение...">
        <button class="icon-btn" id="sendBtn">➤</button>
    </div>
</div>

<script>
// Состояние приложения
let ws = null;
let currentNick = localStorage.getItem("cb_nick") || "";
let currentChat = { type: "public", id: "public", name: "Общий чат" };
let myChannels = [];
let myGroups = [];
let allUsers = [];
let usersOnline = [];
let myLastChats = [];
let currentUiLang = 'ru';
let userSearchDebounce = null;

// Элементы интерфейса
const authScreen = document.getElementById("authScreen");
const authNick = document.getElementById("authNick");
const authPhone = document.getElementById("authPhone");
const authBtn = document.getElementById("authBtn");
const mainApp = document.getElementById("mainApp");
const chat = document.getElementById("chat");
const msgInput = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");
const headerTitle = document.getElementById("headerTitle");
const headerSub = document.getElementById("headerSub");
const modeBarText = document.getElementById("modeBarText");
const menuBtn = document.getElementById("menuBtn");
const menuPanel = document.getElementById("menuPanel");
const directoryOverlay = document.getElementById("directoryOverlay");
const dirBackdrop = document.getElementById("dirBackdrop");
const directoryBody = document.getElementById("directoryBody");
const directorySearchInput = document.getElementById("directorySearchInput");
const openChatsBtn = document.getElementById("openChatsBtn");
const closeDirBtn = document.getElementById("closeDirBtn");
const menuOpenChats = document.getElementById("menuOpenChats");
const menuCreateChannel = document.getElementById("menuCreateChannel");

function isDima() {
    return (currentNick || "").toLowerCase() === "дима";
}

function tr(key) {
    const dict = {
        dirSectionChannels: "Каналы",
        dirSectionGroups: "Группы",
        dirSectionContacts: "Диалоги",
        dirGeneralChat: "Общий чат",
        dirEmpty: "Ничего не найдено",
        statusOnline: "в сети",
        statusOffline: "не в сети"
    };
    return dict[key] || key;
}

function dirEsc(val) {
    return String(val).replace(/'/g, "\\'");
}

function formatTime(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function getLastChatPreview(type, id) {
    const item = (myLastChats || []).find(c => c.chatType === type && c.chatId === id);
    return item ? { text: item.lastMsg || "Сообщение", time: formatTime(item.timestamp) } : null;
}

function getUnreadCount(key) {
    return 0;
}

function directoryItemHTML(icon, title, subtitle, clickAction, badge = 0, time = "") {
    return `
    <div class="dir-item" onclick="${clickAction}">
        <div class="dir-avatar">${icon}</div>
        <div class="dir-info">
            <div class="dir-title-row">
                <span class="dir-title">${title}</span>
                <span class="dir-time">${time}</span>
            </div>
            <div class="dir-sub">${subtitle || ""}</div>
        </div>
        ${badge ? `<div class="dir-badge">${badge}</div>` : ""}
    </div>`;
}

// ---------------- ВКЛАДКА "ЧАТЫ" / RENDER DIRECTORY ----------------
function renderDirectory(filter) {
    if (!directoryBody) return;
    const q = (filter || "").toLowerCase().trim();
    let html = "";

    // 1. Избранное
    if (!q || "избранное saved favorites 收藏".includes(q)) {
        const preview = getLastChatPreview("private", currentNick);
        const savedWord = currentUiLang === 'ru' ? "Избранное" : currentUiLang === 'zh' ? "收藏" : "Saved Messages";
        html += directoryItemHTML("⭐", savedWord, preview ? preview.text : "", `openDirectoryChat('contact','${dirEsc(currentNick)}')`, getUnreadCount(`private_${currentNick}`), preview ? preview.time : "");
    }

    // 2. Общий чат
    if (!q || tr("dirGeneralChat").toLowerCase().includes(q) || "общий чат общее public general".includes(q)) {
        const preview = getLastChatPreview("public", "public");
        const sub = preview ? preview.text : `${usersOnline.length} ${currentUiLang === 'ru' ? 'онлайн' : currentUiLang === 'zh' ? '在线' : 'online'}`;
        html += directoryItemHTML("🌐", tr("dirGeneralChat"), sub, `openDirectoryChat('public')`, getUnreadCount("public"), preview ? preview.time : "");
    }

    // 3. Группы
    const groupsList = (myGroups || []).filter(g => !q || g.name.toLowerCase().includes(q));
    if (groupsList.length) {
        html += `<div class="dir-section">${tr("dirSectionGroups")}</div>`;
        groupsList.forEach(g => {
            const lastMsg = g.messages && g.messages.length ? g.messages[g.messages.length - 1] : null;
            const membersWord = currentUiLang === 'ru' ? 'участников' : currentUiLang === 'zh' ? '名成员' : 'members';
            const sub = lastMsg ? `${lastMsg.from}: ${lastMsg.text || "📎"}` : `${g.members?.length || 0} ${membersWord}`;
            const time = lastMsg ? formatTime(lastMsg.time) : "";
            html += directoryItemHTML("👥", g.name, sub, `openDirectoryChat('group','${dirEsc(g.id)}')`, getUnreadCount(`group_${g.id}`), time);
        });
    }

    // 4. Каналы (приватные находятся ТОЛЬКО по точному 15-значному коду, публичные — по названию и коду)
    const channelsList = (myChannels || []).filter(c => {
        const isSubscribed = Array.isArray(c.subscribers) && c.subscribers.includes(currentNick);
        if (!q) return isSubscribed;

        const isExactCode = c.code && String(c.code).trim() === q;
        const matchesName = !c.isPrivate && c.name && c.name.toLowerCase().includes(q);

        return isExactCode || matchesName;
    });

    if (channelsList.length) {
        html += `<div class="dir-section">${tr("dirSectionChannels")}</div>`;
        channelsList.forEach(c => {
            const lastMsg = c.messages && c.messages.length ? c.messages[c.messages.length - 1] : null;
            const subsWord = currentUiLang === 'ru' ? 'подписчиков' : currentUiLang === 'zh' ? '订阅者' : 'subscribers';
            const sub = c.code ? `Код: ${c.code} · ${c.subscribers?.length || 0} ${subsWord}` : `${c.subscribers?.length || 0} ${subsWord}`;
            const time = lastMsg ? formatTime(lastMsg.time) : "";
            const lockIcon = c.isPrivate ? " 🔒" : "";
            html += directoryItemHTML("📣", c.name + lockIcon, sub, `openDirectoryChat('channel','${dirEsc(c.id)}')`, getUnreadCount(`channel_${c.id}`), time);
        });
    }

    // 5. Диалоги (видны ТОЛЬКО те контакты, с кем уже была переписка; пустые пользователи скрыты)
    const historicalContacts = (myLastChats || []).filter(c => c.chatType === "private").map(c => c.chatId);
    const contactsSource = isDima() ? (allUsers || []) : [...new Set(historicalContacts)];

    const contactsList = contactsSource.filter(u => {
        if (u === currentNick) return false;
        const hasHistory = (myLastChats || []).some(c => c.chatType === "private" && c.chatId === u);
        return q ? u.toLowerCase().includes(q) : hasHistory;
    });

    if (contactsList.length) {
        html += `<div class="dir-section">${tr("dirSectionContacts")}</div>`;
        contactsList.forEach(u => {
            const preview = getLastChatPreview("private", u);
            const sub = preview ? preview.text : (usersOnline.includes(u) ? tr("statusOnline") : tr("statusOffline"));
            const time = preview ? preview.time : "";
            html += directoryItemHTML(u.charAt(0).toUpperCase(), u, sub, `openDirectoryChat('contact','${dirEsc(u)}')`, getUnreadCount(`private_${u}`), time);
        });
    }

    // 6. Поиск любого пользователя по нику или телефону через сервер
    const searchSection = document.createElement("div");
    searchSection.id = "dirUserSearchSection";
    if (q && q.length >= 2) {
        if (userSearchDebounce) clearTimeout(userSearchDebounce);
        userSearchDebounce = setTimeout(() => {
            if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "search_user", query: q }));
        }, 250);
    }

    directoryBody.innerHTML = html || `<div style="text-align:center;padding:24px;opacity:0.5;">${tr("dirEmpty")}</div>`;
    directoryBody.appendChild(searchSection);
}

// Открытие чата из каталога
function openDirectoryChat(type, id) {
    currentChat.type = type;
    currentChat.id = id || type;
    closeDirectory();

    if (type === "public") {
        headerTitle.textContent = "Общий чат";
        headerSub.textContent = `${usersOnline.length} онлайн`;
        modeBarText.textContent = "🌐 Публичный чат ChatterBox";
    } else if (type === "channel") {
        const ch = (myChannels || []).find(c => c.id === id);
        headerTitle.textContent = (ch ? ch.name : "Канал") + (ch && ch.isPrivate ? " 🔒" : "");
        headerSub.textContent = ch && ch.code ? `Код: ${ch.code}` : "Канал";
        modeBarText.textContent = `📣 Канал: ${ch ? ch.name : id}`;
        if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ type: "get_channel_history", channelId: id }));
        }
    } else {
        headerTitle.textContent = id;
        headerSub.textContent = usersOnline.includes(id) ? "в сети" : "не в сети";
        modeBarText.textContent = `💬 Личный диалог с ${id}`;
    }

    chat.innerHTML = "";
}

// Управление панелью каталога (Вкладка Чаты)
function openDirectory() {
    directoryOverlay.classList.add("open");
    dirBackdrop.classList.add("open");
    renderDirectory(directorySearchInput.value);
}

function closeDirectory() {
    directoryOverlay.classList.remove("open");
    dirBackdrop.classList.remove("open");
}

openChatsBtn.onclick = openDirectory;
closeDirBtn.onclick = closeDirectory;
dirBackdrop.onclick = closeDirectory;
menuOpenChats.onclick = () => {
    menuPanel.classList.remove("open");
    openDirectory();
};

directorySearchInput.oninput = (e) => {
    renderDirectory(e.target.value);
};

// Создание канала для всех пользователей с выбором типа
menuCreateChannel.onclick = () => {
    menuPanel.classList.remove("open");
    const name = prompt("Введите название канала:");
    if (name && name.trim()) {
        const isPrivate = confirm("Сделать канал приватным?\n\n• ОК — Приватный (вход только по 15-значному коду)\n• Отмена — Публичный (виден в поиске всем)");
        if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ 
                type: "create_channel", 
                name: name.trim(),
                isPrivate: isPrivate
            }));
        }
    }
};

// Меню действий
menuBtn.onclick = (e) => {
    e.stopPropagation();
    menuPanel.classList.toggle("open");
};
document.addEventListener("click", () => menuPanel.classList.remove("open"));

document.getElementById("menuToggleTheme").onclick = () => {
    document.body.classList.toggle("dark");
    menuPanel.classList.remove("open");
};

document.getElementById("menuLogout").onclick = () => {
    localStorage.removeItem("cb_nick");
    location.reload();
};

// Подключение к WebSocket
function initWS() {
    const protocol = location.protocol === "https:" ? "wss://" : "ws://";
    ws = new WebSocket(protocol + location.host);

    ws.onopen = () => {
        ws.send(JSON.stringify({ 
            type: "auth", 
            nick: currentNick,
            phone: localStorage.getItem("cb_phone") || "" 
        }));
        ws.send(JSON.stringify({ type: "get_my_channels" }));
    };

    ws.onmessage = (event) => {
        try {
            const data = JSON.parse(event.data);

            if (data.type === "channel_update" || data.type === "channel_created") {
                const idx = myChannels.findIndex(c => c.id === data.channel.id);
                if (idx >= 0) myChannels[idx] = data.channel;
                else myChannels.push(data.channel);
                renderDirectory(directorySearchInput.value);
            }

            if (data.type === "my_channels") {
                myChannels = data.channels || [];
                renderDirectory(directorySearchInput.value);
            }

            if (data.type === "users_online") {
                usersOnline = data.users || [];
                headerSub.textContent = `${usersOnline.length} онлайн`;
                renderDirectory(directorySearchInput.value);
            }

            if (data.type === "channel_history") {
                chat.innerHTML = "";
                (data.data || []).forEach(addMessageToUI);
            }

            if (data.type === "search_user_result") {
                const searchSec = document.getElementById("dirUserSearchSection");
                if (searchSec) {
                    if (!data.results || !data.results.length) {
                        searchSec.innerHTML = `<div style="padding:10px 16px;font-size:12px;opacity:0.5;">Пользователь не найден</div>`;
                    } else {
                        searchSec.innerHTML = `<div class="dir-section">Результаты поиска</div>` +
                            data.results.map(u => directoryItemHTML(u.nick.charAt(0).toUpperCase(), u.nick, u.online ? "в сети" : "не в сети", `openDirectoryChat('contact','${dirEsc(u.nick)}')`)).join("");
                    }
                }
            }

            if (data.type === "msg" || data.type === "channel_msg") {
                addMessageToUI(data);
            }
        } catch (err) {
            console.error("WS error:", err);
        }
    };

    ws.onclose = () => {
        setTimeout(initWS, 2000);
    };
}

function addMessageToUI(msg) {
    const isOwn = msg.from === currentNick;
    const div = document.createElement("div");
    div.className = `message ${isOwn ? "own" : ""}`;
    div.innerHTML = `
        <div class="author">${msg.from || "Аноним"}</div>
        <div class="msg-text">${msg.text || ""}</div>
        <div class="time">${formatTime(msg.time || Date.now())}</div>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

sendBtn.onclick = sendMessage;
msgInput.onkeydown = (e) => { if (e.key === "Enter") sendMessage(); };

function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || !ws || ws.readyState !== 1) return;

    if (currentChat.type === "channel") {
        ws.send(JSON.stringify({
            type: "channel_chat",
            channelId: currentChat.id,
            text: text
        }));
    } else {
        ws.send(JSON.stringify({
            type: "msg",
            to: currentChat.id,
            text: text
        }));
    }
    msgInput.value = "";
}

// Авторизация
authBtn.onclick = () => {
    const nick = authNick.value.trim();
    const phone = authPhone.value.trim();
    if (!nick) return alert("Введите никнейм!");
    currentNick = nick;
    localStorage.setItem("cb_nick", nick);
    if (phone) localStorage.setItem("cb_phone", phone);

    authScreen.classList.add("hidden");
    mainApp.classList.remove("hidden");
    initWS();
};

if (currentNick) {
    authScreen.classList.add("hidden");
    mainApp.classList.remove("hidden");
    initWS();
}
