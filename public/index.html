<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ChatterBox</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
    --bg: #b8d9e8;
    --bg-dark: #1a2a3a;
    --text: #111;
    --text-dark: #eee;
    --card-bg: rgba(255,255,255,0.15);
    --card-bg-dark: rgba(0,0,0,0.25);
    --border: rgba(0,0,0,0.06);
    --border-dark: rgba(255,255,255,0.04);
    --msg-bg: rgba(255,255,255,0.75);
    --msg-own: rgba(0,132,255,0.75);
    --shadow: 0 1px 4px rgba(0,0,0,0.04);
    --radius: 14px;
    --font-size: 15px;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    transition: background 0.3s, color 0.3s;
    position: relative;
    overflow: hidden;
    color: var(--text);
    font-size: var(--font-size);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}

body.dark {
    --bg: var(--bg-dark);
    --text: var(--text-dark);
    --card-bg: rgba(255,255,255,0.05);
    --border: rgba(255,255,255,0.04);
    --msg-bg: rgba(255,255,255,0.1);
    --msg-own: rgba(0,132,255,0.6);
}

body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 0;
    background: 
        radial-gradient(ellipse at 10% 20%, rgba(180, 220, 240, 0.5) 0%, transparent 60%),
        radial-gradient(ellipse at 90% 80%, rgba(200, 240, 200, 0.4) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 50%, rgba(240, 220, 180, 0.3) 0%, transparent 70%),
        linear-gradient(135deg, #b8d9e8 0%, #d4e8d4 50%, #f0e6c8 100%);
    pointer-events: none;
}

body.dark::before {
    background: 
        radial-gradient(ellipse at 10% 20%, rgba(60, 100, 140, 0.3) 0%, transparent 60%),
        radial-gradient(ellipse at 90% 80%, rgba(60, 120, 80, 0.25) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 50%, rgba(120, 80, 60, 0.2) 0%, transparent 70%),
        linear-gradient(135deg, #1a2a3a 0%, #1a2a2a 50%, #2a1a1a 100%);
}

.chat {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

.chat::-webkit-scrollbar { width: 4px; }
.chat::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
body.dark .chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); }

.hidden { display: none !important; }

/* Экран авторизации */
.auth-screen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 1000;
}

.auth-card {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 28px;
    padding: 36px 24px;
    width: 100%;
    max-width: 340px;
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    text-align: center;
}
body.dark .auth-card { border-color: rgba(255,255,255,0.08); }

.auth-card h2 { margin-bottom: 24px; font-size: 26px; }
.auth-card input {
    width: 100%;
    padding: 14px 18px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 15px;
    outline: none;
    background: rgba(255,255,255,0.5);
    color: var(--text);
}
body.dark .auth-card input { background: rgba(255,255,255,0.08); border-color: var(--border-dark); }
.auth-card button {
    width: 100%;
    padding: 14px;
    background: #0084ff;
    border: none;
    border-radius: 20px;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    margin-top: 8px;
}

/* Главное приложение */
.main-app {
    display: flex;
    flex-direction: row;
    height: 100%;
    position: relative;
    z-index: 1;
}

/* Боковая панель (каталог чатов) */
.sidebar {
    width: 320px;
    max-width: 100%;
    border-right: 1px solid var(--border);
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: transform 0.3s ease;
}
body.dark .sidebar { border-color: var(--border-dark); background: var(--card-bg-dark); }

.sidebar-header {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border-bottom: 1px solid var(--border);
}

.search-box {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
}
.search-box input {
    width: 100%;
    padding: 8px 14px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.3);
    color: var(--text);
    outline: none;
    font-size: 14px;
}
body.dark .search-box input { background: rgba(255,255,255,0.06); border-color: var(--border-dark); }

.directory-body {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
}

.dir-section {
    padding: 8px 16px 4px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.5;
}

.dir-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    cursor: pointer;
    transition: background 0.15s ease;
}
.dir-item:hover, .dir-item.active {
    background: rgba(0, 132, 255, 0.12);
}
.dir-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #0084ff;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 16px;
    flex-shrink: 0;
}
.dir-info { flex: 1; min-width: 0; }
.dir-title-row { display: flex; justify-content: space-between; align-items: center; }
.dir-title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dir-time { font-size: 11px; opacity: 0.5; }
.dir-sub { font-size: 12px; opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.dir-badge {
    background: #0084ff;
    color: #fff;
    font-size: 10px;
    font-weight: bold;
    border-radius: 10px;
    padding: 2px 6px;
    margin-left: 6px;
}

/* Область чата */
.chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: rgba(255,255,255,0.02);
}

.header {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
}
body.dark .header { background: var(--card-bg-dark); border-bottom-color: var(--border-dark); }

.chat-input-area {
    padding: 10px 14px;
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
}
body.dark .chat-input-area { background: var(--card-bg-dark); border-top-color: var(--border-dark); }

.chat-input-area input {
    flex: 1;
    padding: 10px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.5);
    color: var(--text);
    outline: none;
    font-size: 14px;
}
body.dark .chat-input-area input { background: rgba(255,255,255,0.06); border-color: var(--border-dark); }

.icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 20px;
    padding: 6px;
    border-radius: 50%;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
}
.icon-btn:hover { background: var(--border); }

.message {
    max-width: 75%;
    padding: 8px 14px;
    border-radius: 18px;
    font-size: 14px;
    background: var(--msg-bg);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.15);
    align-self: flex-start;
    word-break: break-word;
    box-shadow: var(--shadow);
}
body.dark .message { border-color: rgba(255,255,255,0.05); }
.message.own {
    background: var(--msg-own);
    color: #fff;
    align-self: flex-end;
}
.message .author {
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 2px;
    color: #0084ff;
}
.message.own .author { color: rgba(255,255,255,0.85); }
.message .time {
    font-size: 10px;
    opacity: 0.6;
    text-align: right;
    margin-top: 4px;
}

/* Меню */
.menu-panel {
    position: fixed;
    top: 54px;
    left: 12px;
    background: var(--card-bg);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    display: none;
    flex-direction: column;
    z-index: 1000;
    min-width: 200px;
    overflow: hidden;
}
.menu-panel.open { display: flex; }
.menu-item {
    padding: 12px 16px;
    cursor: pointer;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
}
.menu-item:last-child { border-bottom: none; }
.menu-item:hover { background: rgba(0,132,255,0.1); }
body.dark .menu-panel { background: var(--card-bg-dark); border-color: var(--border-dark); }

@media (max-width: 768px) {
    .sidebar { width: 100%; }
    .chat-area { display: none; }
    .main-app.chat-open .sidebar { display: none; }
    .main-app.chat-open .chat-area { display: flex; }
}
</style>
</head>
<body>

<!-- Экран входа -->
<div class="auth-screen" id="authScreen">
    <div class="auth-card">
        <h2>ChatterBox</h2>
        <input type="text" id="authNick" placeholder="Ваш никнейм" autocomplete="off">
        <input type="tel" id="authPhone" placeholder="Номер телефона (опционально)" autocomplete="off">
        <button id="authBtn">Войти</button>
    </div>
</div>

<!-- Выпадающее меню действий -->
<div class="menu-panel" id="menuPanel">
    <div class="menu-item" id="menuCreateChannel">📣 Создать канал</div>
    <div class="menu-item" id="menuCreateGroup">👥 Создать группу</div>
    <div class="menu-item" id="menuToggleTheme">🌓 Сменить тему</div>
    <div class="menu-item" id="menuLogout">🚪 Выйти</div>
</div>

<!-- Основное приложение -->
<div class="main-app hidden" id="mainApp">
    <!-- Боковая панель -->
    <div class="sidebar">
        <div class="sidebar-header">
            <button class="icon-btn" id="menuBtn">☰</button>
            <strong id="userDisplayNick">Мой профиль</strong>
            <button class="icon-btn" id="refreshBtn">🔄</button>
        </div>
        <div class="search-box">
            <input type="text" id="directorySearchInput" placeholder="Поиск чатов, каналов или телефона...">
        </div>
        <div class="directory-body" id="directoryBody"></div>
    </div>

    <!-- Область чата -->
    <div class="chat-area">
        <div class="header">
            <div style="display:flex;align-items:center;gap:10px;">
                <button class="icon-btn" id="mobileBackBtn" style="display:none;">⬅</button>
                <div>
                    <h3 id="currentChatTitle">Выберите чат</h3>
                    <small id="currentChatSub" style="opacity:0.6;">онлайн</small>
                </div>
            </div>
            <div id="channelActionContainer"></div>
        </div>
        <div class="chat" id="chatMessages"></div>
        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="Напишите сообщение...">
            <button class="icon-btn" id="sendBtn">➤</button>
        </div>
    </div>
</div>

<script>
// Глобальное состояние
let ws = null;
let currentNick = localStorage.getItem("cb_nick") || "";
let currentChat = { type: "public", id: "public", name: "Общий чат" };
let myChannels = [];
let myGroups = [];
let allUsers = [];
let usersOnline = [];
let myLastChats = [];
let currentUiLang = 'ru';
let userSearchDebounce = null;

// Элементы DOM
const authScreen = document.getElementById("authScreen");
const authNick = document.getElementById("authNick");
const authPhone = document.getElementById("authPhone");
const authBtn = document.getElementById("authBtn");
const mainApp = document.getElementById("mainApp");
const directoryBody = document.getElementById("directoryBody");
const directorySearchInput = document.getElementById("directorySearchInput");
const chatMessages = document.getElementById("chatMessages");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const currentChatTitle = document.getElementById("currentChatTitle");
const currentChatSub = document.getElementById("currentChatSub");
const menuBtn = document.getElementById("menuBtn");
const menuPanel = document.getElementById("menuPanel");
const menuCreateChannel = document.getElementById("menuCreateChannel");
const userDisplayNick = document.getElementById("userDisplayNick");
const mobileBackBtn = document.getElementById("mobileBackBtn");

function isDima() {
    return currentNick.toLowerCase() === "дима";
}

function tr(key) {
    const dict = {
        dirSectionChannels: "Каналы",
        dirSectionGroups: "Группы",
        dirSectionContacts: "Диалоги",
        dirGeneralChat: "Общий чат",
        dirEmpty: "Ничего не найдено",
        statusOnline: "в сети",
        statusOffline: "не в сети"
    };
    return dict[key] || key;
}

function dirEsc(val) {
    return String(val).replace(/'/g, "\\'");
}

function formatTime(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function getLastChatPreview(type, id) {
    const item = (myLastChats || []).find(c => c.chatType === type && c.chatId === id);
    return item ? { text: item.lastMsg || "Сообщение", time: formatTime(item.timestamp) } : null;
}

function getUnreadCount(key) {
    return 0;
}

function directoryItemHTML(icon, title, subtitle, clickAction, badge = 0, time = "") {
    return `
    <div class="dir-item" onclick="${clickAction}">
        <div class="dir-avatar">${icon}</div>
        <div class="dir-info">
            <div class="dir-title-row">
                <span class="dir-title">${title}</span>
                <span class="dir-time">${time}</span>
            </div>
            <div class="dir-sub">${subtitle || ""}</div>
        </div>
        ${badge ? `<div class="dir-badge">${badge}</div>` : ""}
    </div>`;
}

// ---------------- ОСНОВНАЯ ФУНКЦИЯ РЕНДЕРА КАТАЛОГА ----------------
function renderDirectory(filter) {
    if (!directoryBody) return;
    const q = (filter || "").toLowerCase().trim();
    let html = "";

    // 1. Избранное
    if (!q || "избранное saved favorites 收藏".includes(q)) {
        const preview = getLastChatPreview("private", currentNick);
        html += directoryItemHTML("⭐", "Избранное", preview ? preview.text : "", `openDirectoryChat('contact','${dirEsc(currentNick)}')`, 0, preview ? preview.time : "");
    }

    // 2. Общий чат
    if (!q || "общий чат общее public general".includes(q)) {
        const preview = getLastChatPreview("public", "public");
        const sub = preview ? preview.text : `${usersOnline.length} онлайн`;
        html += directoryItemHTML("🌐", tr("dirGeneralChat"), sub, `openDirectoryChat('public','public')`, 0, preview ? preview.time : "");
    }

    // 3. Группы
    const groupsList = (myGroups || []).filter(g => !q || g.name.toLowerCase().includes(q));
    if (groupsList.length) {
        html += `<div class="dir-section">${tr("dirSectionGroups")}</div>`;
        groupsList.forEach(g => {
            const lastMsg = g.messages && g.messages.length ? g.messages[g.messages.length - 1] : null;
            const sub = lastMsg ? `${lastMsg.from}: ${lastMsg.text || "📎"}` : `${g.members?.length || 0} участников`;
            const time = lastMsg ? formatTime(lastMsg.time) : "";
            html += directoryItemHTML("👥", g.name, sub, `openDirectoryChat('group','${dirEsc(g.id)}')`, 0, time);
        });
    }

    // 4. Каналы (приватные находятся ТОЛЬКО по точному 15-значному коду)
    const channelsList = (myChannels || []).filter(c => {
        const isSubscribed = Array.isArray(c.subscribers) && c.subscribers.includes(currentNick);
        if (!q) return isSubscribed;

        const isExactCode = c.code && String(c.code).trim() === q;
        const matchesName = !c.isPrivate && c.name && c.name.toLowerCase().includes(q);

        return isExactCode || matchesName;
    });

    if (channelsList.length) {
        html += `<div class="dir-section">${tr("dirSectionChannels")}</div>`;
        channelsList.forEach(c => {
            const lastMsg = c.messages && c.messages.length ? c.messages[c.messages.length - 1] : null;
            const sub = c.code ? `Код: ${c.code} · ${c.subscribers?.length || 0} подп.` : `${c.subscribers?.length || 0} подп.`;
            const time = lastMsg ? formatTime(lastMsg.time) : "";
            const lockIcon = c.isPrivate ? " 🔒" : "";
            html += directoryItemHTML("📣", c.name + lockIcon, sub, `openDirectoryChat('channel','${dirEsc(c.id)}')`, 0, time);
        });
    }

    // 5. Диалоги (без поиска видны ТОЛЬКО те, с кем есть история переписки)
    const historicalContacts = (myLastChats || []).filter(c => c.chatType === "private").map(c => c.chatId);
    const contactsSource = isDima() ? (allUsers || []) : [...new Set(historicalContacts)];

    const contactsList = contactsSource.filter(u => {
        if (u === currentNick) return false;
        const hasHistory = (myLastChats || []).some(c => c.chatType === "private" && c.chatId === u);
        return q ? u.toLowerCase().includes(q) : hasHistory;
    });

    if (contactsList.length) {
        html += `<div class="dir-section">${tr("dirSectionContacts")}</div>`;
        contactsList.forEach(u => {
            const preview = getLastChatPreview("private", u);
            const sub = preview ? preview.text : (usersOnline.includes(u) ? tr("statusOnline") : tr("statusOffline"));
            const time = preview ? preview.time : "";
            html += directoryItemHTML(u.charAt(0).toUpperCase(), u, sub, `openDirectoryChat('contact','${dirEsc(u)}')`, 0, time);
        });
    }

    // 6. Поиск пользователей через сервер (по имени и телефону)
    const searchSection = document.createElement("div");
    searchSection.id = "dirUserSearchSection";
    if (q && q.length >= 2) {
        if (userSearchDebounce) clearTimeout(userSearchDebounce);
        userSearchDebounce = setTimeout(() => {
            if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "search_user", query: q }));
        }, 250);
    }

    directoryBody.innerHTML = html || `<div style="text-align:center;padding:20px;opacity:0.5;">${tr("dirEmpty")}</div>`;
    directoryBody.appendChild(searchSection);
}

// Открытие чата
function openDirectoryChat(type, id) {
    currentChat.type = type;
    currentChat.id = id;

    if (window.innerWidth <= 768) {
        mainApp.classList.add("chat-open");
        mobileBackBtn.style.display = "inline-flex";
    }

    if (type === "public") {
        currentChatTitle.textContent = "Общий чат";
        currentChatSub.textContent = `${usersOnline.length} онлайн`;
    } else if (type === "channel") {
        const ch = (myChannels || []).find(c => c.id === id);
        currentChatTitle.textContent = ch ? ch.name + (ch.isPrivate ? " 🔒" : "") : "Канал";
        currentChatSub.textContent = ch && ch.code ? `Код: ${ch.code}` : "Канал";
        if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ type: "get_channel_history", channelId: id }));
        }
    } else {
        currentChatTitle.textContent = id;
        currentChatSub.textContent = usersOnline.includes(id) ? "в сети" : "не в сети";
    }

    chatMessages.innerHTML = "";
    document.querySelectorAll(".dir-item").forEach(el => el.classList.remove("active"));
}

mobileBackBtn.onclick = () => {
    mainApp.classList.remove("chat-open");
    mobileBackBtn.style.display = "none";
};

// Создание канала (для всех пользователей)
menuCreateChannel.onclick = () => {
    menuPanel.classList.remove("open");
    const name = prompt("Введите название канала:");
    if (name && name.trim()) {
        const isPrivate = confirm("Сделать канал приватным?\n\n• ОК — Приватный (вход только по 15-значному коду)\n• Отмена — Публичный (виден в поиске всем)");
        if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ 
                type: "create_channel", 
                name: name.trim(),
                isPrivate: isPrivate
            }));
        }
    }
};

// Меню действий
menuBtn.onclick = (e) => {
    e.stopPropagation();
    menuPanel.classList.toggle("open");
};
document.addEventListener("click", () => menuPanel.classList.remove("open"));

document.getElementById("menuToggleTheme").onclick = () => {
    document.body.classList.toggle("dark");
    menuPanel.classList.remove("open");
};

document.getElementById("menuLogout").onclick = () => {
    localStorage.removeItem("cb_nick");
    location.reload();
};

directorySearchInput.oninput = (e) => {
    renderDirectory(e.target.value);
};

// Подключение к WebSocket
function initWS() {
    const protocol = location.protocol === "https:" ? "wss://" : "ws://";
    ws = new WebSocket(protocol + location.host);

    ws.onopen = () => {
        ws.send(JSON.stringify({ 
            type: "auth", 
            nick: currentNick,
            phone: localStorage.getItem("cb_phone") || "" 
        }));
        ws.send(JSON.stringify({ type: "get_my_channels" }));
    };

    ws.onmessage = (event) => {
        try {
            const data = JSON.parse(event.data);

            if (data.type === "channel_update" || data.type === "channel_created") {
                const idx = myChannels.findIndex(c => c.id === data.channel.id);
                if (idx >= 0) myChannels[idx] = data.channel;
                else myChannels.push(data.channel);
                renderDirectory(directorySearchInput.value);
            }

            if (data.type === "my_channels") {
                myChannels = data.channels || [];
                renderDirectory(directorySearchInput.value);
            }

            if (data.type === "users_online") {
                usersOnline = data.users || [];
                renderDirectory(directorySearchInput.value);
            }

            if (data.type === "channel_history") {
                chatMessages.innerHTML = "";
                (data.data || []).forEach(addMessageToUI);
            }

            if (data.type === "search_user_result") {
                const searchSec = document.getElementById("dirUserSearchSection");
                if (searchSec) {
                    if (!data.results || !data.results.length) {
                        searchSec.innerHTML = `<div style="padding:10px 16px;font-size:12px;opacity:0.5;">Пользователь не найден</div>`;
                    } else {
                        searchSec.innerHTML = `<div class="dir-section">Результаты поиска</div>` +
                            data.results.map(u => directoryItemHTML(u.nick.charAt(0).toUpperCase(), u.nick, u.online ? "в сети" : "не в сети", `openDirectoryChat('contact','${dirEsc(u.nick)}')`)).join("");
                    }
                }
            }

            if (data.type === "msg" || data.type === "channel_msg") {
                addMessageToUI(data);
            }
        } catch (err) {
            console.error("WS Parse error", err);
        }
    };

    ws.onclose = () => {
        setTimeout(initWS, 2000);
    };
}

function addMessageToUI(msg) {
    const isOwn = msg.from === currentNick;
    const div = document.createElement("div");
    div.className = `message ${isOwn ? "own" : ""}`;
    div.innerHTML = `
        <div class="author">${msg.from || "Аноним"}</div>
        <div class="msg-text">${msg.text || ""}</div>
        <div class="time">${formatTime(msg.time || Date.now())}</div>
    `;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

sendBtn.onclick = sendMessage;
messageInput.onkeydown = (e) => { if (e.key === "Enter") sendMessage(); };

function sendMessage() {
    const text = messageInput.value.trim();
    if (!text || !ws || ws.readyState !== 1) return;

    if (currentChat.type === "channel") {
        ws.send(JSON.stringify({
            type: "channel_chat",
            channelId: currentChat.id,
            text: text
        }));
    } else {
        ws.send(JSON.stringify({
            type: "msg",
            to: currentChat.id,
            text: text
        }));
    }
    messageInput.value = "";
}

// Авторизация
authBtn.onclick = () => {
    const nick = authNick.value.trim();
    const phone = authPhone.value.trim();
    if (!nick) return alert("Введите никнейм!");
    currentNick = nick;
    localStorage.setItem("cb_nick", nick);
    if (phone) localStorage.setItem("cb_phone", phone);

    authScreen.classList.add("hidden");
    mainApp.classList.remove("hidden");
    userDisplayNick.textContent = nick;
    initWS();
};

if (currentNick) {
    authScreen.classList.add("hidden");
    mainApp.classList.remove("hidden");
    userDisplayNick.textContent = currentNick;
    initWS();
}
</script>
